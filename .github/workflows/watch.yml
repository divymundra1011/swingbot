name: Live watch
on:
  schedule:
    - cron: "*/15 3-10 * * 1-5"   # every 15 min, 08:45-16:00 IST (the script itself checks 09:15-15:30)
  workflow_dispatch: {}
concurrency: { group: swing, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python watch.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save results
        run: |
          git config user.name "swingbot"; git config user.email "swingbot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "live update" && git pull --rebase && git push)
